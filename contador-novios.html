<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contador de días juntos</title>
  <style>
    :root {
      font-family: Inter, Arial, sans-serif;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, #2b1133 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, #1a2348 0%, transparent 48%),
        #090b14;
      color: #f3f5ff;
      padding: 1.2rem;
    }

    .card {
      width: min(92vw, 620px);
      background: rgba(15, 18, 34, 0.88);
      border: 1px solid rgba(201, 168, 255, 0.25);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
      padding: 2rem 1.4rem;
    }

    h1 {
      margin: 0;
      line-height: 1.3;
      font-size: clamp(1.2rem, 2.8vw, 2rem);
      color: #d9c5ff;
    }

    .days {
      margin-top: 1rem;
      font-size: clamp(2.2rem, 8vw, 4.2rem);
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.04em;
      text-shadow: 0 0 18px rgba(199, 165, 255, 0.45);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Al dia de hoy llevamos juntos:</h1>
    <div class="days" id="daysCounter">0 días</div>
  </main>

  <script>
    const START_DATE = new Date('2025-08-31T00:00:00');
    const daysCounter = document.getElementById('daysCounter');

    function updateDaysCounter() {
      const now = new Date();
      const diffMs = now.getTime() - START_DATE.getTime();
      const days = Math.max(0, Math.floor(diffMs / (1000 * 60 * 60 * 24)));
      daysCounter.textContent = `${days} día${days === 1 ? '' : 's'}`;
    }

    updateDaysCounter();
    setInterval(updateDaysCounter, 1000 * 60);
  </script>
</body>
</html>
