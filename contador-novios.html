<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contador de días juntos</title>
  <style>
    :root {
      font-family: Inter, Arial, sans-serif;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, #2b1133 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, #1a2348 0%, transparent 48%),
        #090b14;
      color: #f3f5ff;
      padding: 1.2rem;
      overflow: hidden;
    }

    .sky {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .stars,
    .stars::before,
    .stars::after {
      position: absolute;
      inset: 0;
      content: "";
      background-repeat: repeat;
      opacity: 0.8;
      animation: twinkle 6s ease-in-out infinite alternate;
    }

    .stars {
      background-image: radial-gradient(2px 2px at 10% 20%, #ffffff, transparent),
        radial-gradient(1.5px 1.5px at 30% 70%, #d9ddff, transparent),
        radial-gradient(1.7px 1.7px at 60% 40%, #ffffff, transparent),
        radial-gradient(2px 2px at 85% 30%, #c8d4ff, transparent),
        radial-gradient(1.6px 1.6px at 70% 85%, #ffffff, transparent),
        radial-gradient(1.8px 1.8px at 20% 90%, #e5e9ff, transparent);
      background-size: 420px 420px;
    }

    .stars::before {
      background-image: radial-gradient(1.3px 1.3px at 15% 45%, #ffffff, transparent),
        radial-gradient(1.8px 1.8px at 42% 10%, #d0d7ff, transparent),
        radial-gradient(1.5px 1.5px at 75% 60%, #ffffff, transparent),
        radial-gradient(1.8px 1.8px at 90% 90%, #d9ddff, transparent);
      background-size: 520px 520px;
      animation-duration: 8s;
      opacity: 0.55;
    }

    .stars::after {
      background-image: radial-gradient(2px 2px at 5% 80%, #ffffff, transparent),
        radial-gradient(1.5px 1.5px at 55% 55%, #dfe5ff, transparent),
        radial-gradient(2px 2px at 95% 15%, #ffffff, transparent);
      background-size: 680px 680px;
      animation-duration: 10s;
      opacity: 0.45;
    }

    @keyframes twinkle {
      0% {
        opacity: 0.35;
        transform: scale(1);
      }
      100% {
        opacity: 0.9;
        transform: scale(1.01);
      }
    }

    .card {
      width: min(92vw, 620px);
      background: rgba(15, 18, 34, 0.88);
      border: 1px solid rgba(201, 168, 255, 0.25);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
      padding: 2rem 1.4rem;
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 0;
      line-height: 1.3;
      font-size: clamp(1.2rem, 2.8vw, 2rem);
      color: #d9c5ff;
    }

    .days {
      margin-top: 1rem;
      font-size: clamp(2.2rem, 8vw, 4.2rem);
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.04em;
      text-shadow: 0 0 18px rgba(199, 165, 255, 0.45);
    }

    .months {
      margin-top: 0.4rem;
      font-size: clamp(0.95rem, 2.4vw, 1.2rem);
      font-weight: 400;
      color: #c8cede;
      letter-spacing: 0.01em;
    }

    .moon-button {
      margin: 1rem auto 0;
      display: block;
      width: min(180px, 42vw);
      aspect-ratio: 1 / 1;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      transition: transform 0.2s ease;
    }

    .moon-button:hover {
      transform: scale(1.03);
    }

    .moon-button:active {
      transform: scale(0.98);
    }

    .moon-button.hidden {
      opacity: 0;
      transform: scale(0.78);
    }

    .moon-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 20px rgba(255, 240, 161, 0.35));
    }

    .moon-hint {
      margin-top: 0.4rem;
      font-size: 0.95rem;
      color: #f2dd94;
      letter-spacing: 0.02em;
    }

    .message {
      margin-top: 1rem;
      min-height: 1.8em;
      font-size: clamp(1rem, 2.4vw, 1.35rem);
      color: #f6e8ff;
      transition: all 0.25s ease;
    }

    .message.alt-font {
      font-family: "Brush Script MT", "Segoe Script", cursive;
      font-size: clamp(1.4rem, 3vw, 2rem);
      color: #ffd9f4;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
  </div>

  <main class="card">
    <h1>Al dia de hoy llevamos juntos:</h1>
    <div class="days" id="daysCounter">0 días</div>
    <div class="months" id="monthsCounter">0.00 meses</div>

    <button class="moon-button" id="moonButton" type="button" aria-label="Luna interactiva">
      <svg class="moon-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
        <defs>
          <radialGradient id="moonGlow" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#fffbe0" />
            <stop offset="55%" stop-color="#f8ecab" />
            <stop offset="100%" stop-color="#e7d98c" />
          </radialGradient>
        </defs>
        <circle cx="100" cy="100" r="92" fill="url(#moonGlow)" stroke="#f4e6a4" stroke-width="4" />
        <ellipse cx="58" cy="65" rx="18" ry="13" fill="#d6c47b" opacity="0.65" />
        <ellipse cx="138" cy="62" rx="15" ry="11" fill="#dbc983" opacity="0.62" />
        <ellipse cx="54" cy="130" rx="16" ry="12" fill="#cfbd72" opacity="0.58" />
        <ellipse cx="145" cy="130" rx="18" ry="13" fill="#d3c278" opacity="0.56" />
        <path d="M56 88 Q77 70 95 88" fill="none" stroke="#6f4c2b" stroke-width="4" stroke-linecap="round" />
        <path d="M107 88 Q124 70 145 88" fill="none" stroke="#6f4c2b" stroke-width="4" stroke-linecap="round" />
        <path d="M62 112 Q80 123 96 112" fill="none" stroke="#3f2921" stroke-width="6" stroke-linecap="round" />
        <path d="M104 112 Q120 123 138 112" fill="none" stroke="#3f2921" stroke-width="6" stroke-linecap="round" />
        <path d="M72 142 Q100 168 128 142" fill="none" stroke="#6f4c2b" stroke-width="5" stroke-linecap="round" />
        <circle cx="100" cy="134" r="6" fill="#f1de96" stroke="#8a6a44" stroke-width="2" />
        <ellipse cx="73" cy="130" rx="15" ry="9" fill="#ffbe93" opacity="0.4" />
        <ellipse cx="127" cy="130" rx="15" ry="9" fill="#ffbe93" opacity="0.4" />
      </svg>
    </button>
    <div class="moon-hint">apachurra la luna</div>

    <div class="message" id="moonMessage"></div>
  </main>

  <script>
    const START_DATE = new Date('2025-08-31T00:00:00');
    const daysCounter = document.getElementById('daysCounter');
    const monthsCounter = document.getElementById('monthsCounter');
    const moonButton = document.getElementById('moonButton');
    const moonMessage = document.getElementById('moonMessage');

    let moonClicks = 0;

    function updateCounters() {
      const now = new Date();
      const diffMs = now.getTime() - START_DATE.getTime();
      const safeDiffMs = Math.max(0, diffMs);
      const days = Math.floor(safeDiffMs / (1000 * 60 * 60 * 24));
      const months = safeDiffMs / (1000 * 60 * 60 * 24 * 30.436875);

      daysCounter.textContent = `${days} día${days === 1 ? '' : 's'}`;
      monthsCounter.textContent = `${months.toFixed(2)} meses`;
    }

    moonButton.addEventListener('click', () => {
      moonClicks += 1;
      moonMessage.classList.remove('alt-font');

      if (moonClicks === 1) {
        moonButton.classList.add('hidden');
        moonMessage.textContent = 'quiero estar contigo siempre Alison';
      } else if (moonClicks === 2) {
        moonMessage.textContent = 'siempre';
      } else {
        moonMessage.textContent = 'siempre';
        moonMessage.classList.add('alt-font');
      }
    });

    updateCounters();
    setInterval(updateCounters, 1000 * 60);
  </script>
</body>
</html>
